name: memory-sync

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
      - -c
      - wal_compression=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./server/db/002_app_role.sh:/docker-entrypoint-initdb.d/002_app_role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.80
    security_opt:
      - no-new-privileges:true

  api:
    build: ./server/api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    mem_reservation: 128m
    cpus: 0.70
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 96m
    mem_reservation: 32m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
